reference_grid:
  mask_regions:
    crs: "EPSG:6933"
    transform: [1000.0, 0.0, 2260000.0, 0.0, -1000.0, 1558000.0]
    shape: [1125, 1204]
    bounds: [2260000.0, 433000.0, 3464000.0, 1558000.0]

runtime:
  target_product: "viirs"
  study_start_date: "2002-07-01"
  tamsat:
    sm_version: "2.3.1"
  lake_levels:
    albert_bbox: [30.5, 1.5, 31.5, 2.5]
    albert_collection: "HYDROWEB_LAKES_OPE"
    albert_zip_path: "data/downloads/lake_levels/albert.zip"
    temp_extraction_dir: "data/downloads/lake_levels/temp_extraction"
    albert_target_paths:
      - "HYDROWEB_LAKES_OPE/hydroprd_L_albert.txt"
      - "HYDROWEB_LAKES_OPE/HYDROWEB_LAKES_OPE/hydroprd_L_albert.txt"
  teleconnections:
    min_date: "2002-07-01"
  viirs:
    use_preliminary_for_deployment: true
    request_retries: 3
    retry_delay_seconds: 2
    request_timeout_seconds: 120

# Shared by temporal forecasts and spatial ConvLSTM outputs.
forecast:
  horizon_periods: 6
  horizon_months: 2
  date_generation_buffer_days: 120
  interval_percent: 80

outputs:
  root: "predictions"
  forecast_performance_csv: "predictions/forecast_performance.csv"
  temporal_csv_filename: "temporal_predictions.csv"
  model_report_filename: "model_performance.json"
  graph_dpi: 220

# Fail-fast completeness checks run before model fitting or deployment inference.
data_preflight:
  enabled: true
  minimum_target_rows: 100
  maximum_target_missing_fraction: 0.0
  minimum_date_coverage_fraction: 0.95
  maximum_numeric_missing_fraction: 0.15
  ecmwf:
    minimum_available_fraction_after_first: 0.95
    maximum_trailing_missing_periods: 1
  report_paths:
    ablation: "model/ablation/data_preflight.json"
    deployment_initial: "predictions/data_preflight_before_updates.json"
    deployment: "predictions/data_preflight.json"

spatial_training:
  model_path: "model/spatial_model.keras"
  elevation_path: "data/maps/elevation.npy"
  basin_attributes_path: "data/maps/basin_attributes.npy"
  glofas_path: "data/maps/flood_return_period/glofas_10_year_rp.tif"
  sequence_length: 6
  patch_size: 64
  stride: 32
  patches_per_timestep: 16
  batch_size: 8
  hdf5_cache_mb: 128
  backup_dir: ""
  backup_frequency_batches: 500
  mixed_precision: true
  filters: [32]
  kernel_size: [3, 3]
  activation: "relu"
  output_activation: "sigmoid"
  optimizer: "adam"
  learning_rate: 0.001
  loss: "mean_squared_error"
  metrics: ["mae"]
  max_epochs: 200
  validation_fraction: 0.2
  early_stopping_patience: 10
  early_stopping_min_delta: 1.0e-5
  checkpoint_monitor: "val_loss"
  checkpoint_mode: "min"
  reduce_lr_factor: 0.5
  reduce_lr_patience: 5
  minimum_learning_rate: 1.0e-6
  seed: 42

spatial_fine_tuning:
  source_model_path: "model/spatial_model.keras"
  output_model_path: "model/spatial_model.keras"
  learning_rate: 0.0001
  max_epochs: 50
  early_stopping_patience: 8
  early_stopping_min_delta: 1.0e-5
  reduce_lr_factor: 0.5
  reduce_lr_patience: 4
  minimum_learning_rate: 1.0e-7
  recent_training_periods: 0
  freeze_convlstm_layers: false
  backup_dir: ""
  backup_frequency_batches: 500
  run_validation: true

