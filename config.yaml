    crs: "EPSG:6933"
    transform: [1000.0, 0.0, 2260000.0, 0.0, -1000.0, 1558000.0]
    shape: [1125, 1204]
    bounds: [2260000.0, 433000.0, 3464000.0, 1558000.0]

runtime:
  target_product: "viirs"
  study_start_date: "2002-07-01"
  tamsat:
    sm_version: "2.3.1"
  lake_levels:
    albert_bbox: [30.5, 1.5, 31.5, 2.5]
    albert_collection: "HYDROWEB_LAKES_OPE"
    albert_zip_path: "data/downloads/lake_levels/albert.zip"
    temp_extraction_dir: "data/downloads/lake_levels/temp_extraction"
    albert_target_paths:
      - "HYDROWEB_LAKES_OPE/hydroprd_L_albert.txt"
      - "HYDROWEB_LAKES_OPE/HYDROWEB_LAKES_OPE/hydroprd_L_albert.txt"
  teleconnections:
    min_date: "2002-07-01"

# Shared by temporal forecasts and spatial ConvLSTM outputs.
forecast:
  horizon_periods: 6
  horizon_months: 2

spatial_training:
  model_path: "model/spatial_model.keras"
  elevation_path: "data/maps/elevation.npy"
  basin_attributes_path: "data/maps/basin_attributes.npy"
  glofas_path: "data/maps/flood_return_period/glofas_10_year_rp.tif"
  sequence_length: 6
  patch_size: 64
  stride: 32
  patches_per_timestep: 16
  batch_size: 8
  hdf5_cache_mb: 128
  backup_dir: ""
  backup_frequency_batches: 500
  mixed_precision: true
  filters: [32]
  max_epochs: 200
  validation_fraction: 0.2
  early_stopping_patience: 10
  early_stopping_min_delta: 1.0e-5
  seed: 42

spatial_validation:
  enabled: true
  inundation_threshold: 0.5
  glofas_20_year_path: "data/maps/glofas/merged_raster_SSD_20_20260604164952.tif"
  glofas_100_year_path: "data/maps/glofas/merged_raster_SSD_100_20260604172751.tif"

# Temporal-model ablation and deployment configuration. The key remains stable
# so existing experiment metadata and artifact paths remain compatible.
ablation:
  enabled: true
  pipeline:
    target_column: "percent_inundation_ssd"
    imputation_warning_threshold: 0.10
    drop_metadata_columns: true
    metrics:
      extreme_event_top_fraction: 0.10
    feature_selection:
      enabled: true
      selection_model_type: "elastic_net"
      near_constant_variance_threshold: 1.0e-8
      high_correlation_threshold: 0.995
      cv_splits: 3
      candidate_feature_counts: [8, 16, 32]
      include_all_features_candidate: true
      elastic_net:
        alpha: 0.001
        l1_ratio: 0.5
        max_iter: 10000
      cache:
        enabled: true
    pca:
      enabled: false
      n_components: 0.95
      whiten: false
      seed: 42
    transformer:
      history_length: 12
      d_model: 64
      nhead: 4
      encoder_layers: 2
      decoder_layers: 2
      feedforward_dim: 128
      dropout: 0.1
      learning_rate: 0.001
      weight_decay: 0.0001
      batch_size: 32
      epochs: 200
      patience: 20
      validation_fraction: 0.15
      predictive_samples: 30
    optional_feature_blocks:
      calendar: true
      include_ecmwf_hindcasts: true
      include_target_lag_features: true
      include_feature_lag_features: true
      lag_steps: [1, 2, 3, 6, 12]
  experiments:
    models: ["random_forest", "elastic_net", "transformer"]
    training_cutoff_dates: ["2018-01-01"]
    autoregressive_values: [false]
    target_types: ["raw", "first_differenced", "seasonally_differenced"]
    inundation_products: ["viirs"]
    seed: 42
    log_path: "model/ablation/ablation_experiment_log.csv"
  staged:
    enabled: true
    top_n_model_configurations: 3
    ranking_metric: "avg_peak_f1"
    fixed_preprocessing:
      include_ecmwf_hindcasts: true
      include_target_lag_features: true
      include_feature_lag_features: true
    feature_block_ablations:
      - name: "no_ecmwf"
        include_ecmwf_hindcasts: false
        include_target_lag_features: true
        include_feature_lag_features: true
      - name: "no_target_lags"
        include_ecmwf_hindcasts: true
        include_target_lag_features: false
        include_feature_lag_features: true
      - name: "no_feature_lags"
        include_ecmwf_hindcasts: true
        include_target_lag_features: true
        include_feature_lag_features: false
      - name: "no_lags"
        include_ecmwf_hindcasts: true
        include_target_lag_features: false
        include_feature_lag_features: false
      - name: "historical_only"
        include_ecmwf_hindcasts: false
        include_target_lag_features: false
        include_feature_lag_features: false
  artifacts:
    base_dir: "model/ablation/artifacts"

