sources:
  # Final maps are the immutable historical/training record. Preliminary maps
  # are overlaid only for operational forecasts and never enter that record.
  viirs_base_url: "https://gws-access.jasmin.ac.uk/public/tamsat/INFLOW/south-sudan_flood-maps/v2.0/final/"
  viirs_final_base_url: "https://gws-access.jasmin.ac.uk/public/tamsat/INFLOW/south-sudan_flood-maps/v2.0/final/"
  viirs_prelim_base_url: "https://gws-access.jasmin.ac.uk/public/tamsat/INFLOW/south-sudan_flood-maps/v2.0/prelim/"
  viirs_prelim_catalogue_url: "https://gws-access.jasmin.ac.uk/public/tamsat/INFLOW/south-sudan_flood-maps/v2.0/prelim/prelim_versions.csv"
  modis_base_url: "https://data.earthobservation.vam.wfp.org/public-share/sudd_wetland_monitoring/modis_flood_masks/ssdmask"
  rainfall_url: "https://gws-access.jasmin.ac.uk/public/tamsat/INFLOW/rainfall/rfe_time-series/combined/rfe_19830101-present_Lake-Victoria.csv"
  lake_levels:
    albert_api_url: "https://hydroweb.next.theia-land.fr/api"
    albert_api_key: "70s88Dpwc0UraJi9n4EouE7UXCbXzQJkSdCeT1cLNy4EcczioA"
    victoria_url: "https://blueice.gsfc.nasa.gov/gwm/timeseries/lake000314.10d.2.txt"
    kyoga_url: "https://blueice.gsfc.nasa.gov/gwm/timeseries/lake000398.10d.2.txt"
  teleconnections:
    oni: "https://www.cpc.ncep.noaa.gov/data/indices/oni.ascii.txt"
    sst: "https://www.cpc.ncep.noaa.gov/data/indices/sstoi.indices"
    soi: "https://www.cpc.ncep.noaa.gov/data/indices/soi"
    mjo: "https://www.cpc.ncep.noaa.gov/products/precip/CWlink/daily_mjo_index/proj_norm_order.ascii"
    dmi: "https://www.cpc.ncep.noaa.gov/products/international/ocean_monitoring/indian/IODMI/mnth.ersstv5.clim19912020.dmi_current.txt"
  ecmwf:
    base_url: "https://gws-access.jasmin.ac.uk/public/tamsat/tamsat_alert/jess_hindcasts/"
    hindcast_base_url: "https://gws-access.jasmin.ac.uk/public/tamsat/tamsat_alert/jess_hindcasts/"
    forecast_2025_base_url: "https://gws-access.jasmin.ac.uk/public/tamsat/tamsat_alert/jess_forecasts_2025/"
    forecast_rt_base_url: "https://gws-access.jasmin.ac.uk/public/tamsat/tamsat_alert/jess_forecasts_rt/"
    download_workers: 4
    request_timeout_seconds: 60
    download_retries: 4
    retry_delay_seconds: 3
    download_chunk_mb: 4
    user_agent: "INFLOW-AI/1.0"
    skip_empty_remote_files: true
    max_initialization_age_days: 6
    lead_windows_days: [[0, 10], [10, 20], [20, 30], [30, 40]]
    hdf5_compression: "gzip"
    hdf5_compression_level: 4

